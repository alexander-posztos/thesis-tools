# free-choice arm with both named tools: minimal.yaml with model.tools set to [search, read], so the surface is bash
# plus search plus read, no reason fields, no directive, no blocking. The prompt is byte-identical to minimal.yaml
# (tests/test_model.py checks that). Used with --ak model_class=thesis_tools.model.ToolsModel.
#
# why: the question "does the agent keep using bash when both tools are offered and nothing nudges it" needs an arm
# with nothing else changed. Qwen's reason fields never moved adoption (2.8% with and without), so they are left out.
#
# min_request_interval is run infrastructure, not part of the arm: 8 parallel trials under a quota of 1,500 requests
# per hour is 8 * 3600 / 1500 = 19.2 s between calls per trial. Adjust for other n or quotas, drop it without a quota.
#
# mini-swe-agent's default instance_template is 3 KB of bash examples and formatting rules from before native tool calling.
# we replace it with a short one that names no tool, the tools are only described by their schemas.
#
# model_kwargs is the retry block from bash.yaml. format_error_template is the one from tools.yaml without
# the bash specific text.
model:
  tools: [search, read]
  min_request_interval: 19.2
  model_kwargs:
    num_retries: 15
    retry_strategy: exponential_backoff_retry
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with a tool call.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Every response must contain at least one tool call. To finish, run `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` as the only bash command in that call.
    {%- endif %}
agent:
  instance_template: |
    Please solve this issue: {{task}}

    Use your tools to inspect the repository and implement the fix. Every call runs in a fresh subshell, so directory changes and environment variables do not persist between calls.

    When you are done, run `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` as the only bash command in that call. You cannot continue after it.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
